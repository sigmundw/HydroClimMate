# Self-test fixtures for hrldas-noahmp's curated checks.yaml (built on the fly by tools/selftest.py --packs; nothing here is stored output).
pack: "hrldas-noahmp"
cases:
  - pitfall_id: "a-paired-urban-onoff-run-differs-in-snow-soil-or-radiation"
    faulty:
      kind: "untouched_var_diff"
      var: "snow_var"
      switch: "SF_URBAN_PHYSICS"
      note: "A/B differ in a variable keyword-matching the pack's declared untouched fields -- the switch annotation must flag it NOT ATTRIBUTABLE"
    clean:
      kind: "exchanged_var_diff"
      var: "HFX"
      switch: "SF_URBAN_PHYSICS"
      note: "A/B differ in a declared exchanged field -- no NOT ATTRIBUTABLE flag expected"
  - pitfall_id: "everything-over-water-is-a-huge-negative-number-or-the-mean-is-nonsense"
    faulty:
      kind: "undeclared_large_negative_fill"
      var: "snow_field"
      note: "large-negative values present, no _FillValue/missing_value attribute -- FIRE"
    clean:
      kind: "no_large_negative_or_fill_declared"
      var: "snow_field"
      note: "no large-negative values and/or fill attribute declared -- QUIET"
