note: "What route/build/Makefile requires, as facts. `must_be_set` are the variables the Makefile itself aborts on when they are empty; `settings` are the user-configurable variables with the value the pinned checkout ships (an empty shipped value means the user must fill it in). `compiler_flags` lists each FLAGS assignment with the compiler/mode combination that selects it. NetCDF (C and Fortran) is unconditional; MPI is reached through the compiler wrapper named in FC_EXE; PIO, PnetCDF, GPTL and OpenMP are switched by isPIO/isGPTL/isOpenMP. This pack never builds or runs the model: these are read facts. `count` counts `settings` only."
