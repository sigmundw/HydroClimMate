pack: "vic"
title: "VIC / Variable Infiltration Capacity"
depth: "reference"
version_scope: "source commit 14a371a8 (tag 5.1.0); drivers classic + image; sample data (Stehekin) submodule 3f2dcb4"
prose:
  - file: "README.md"
    purpose: "human-facing: what the pack covers, how to use and regenerate it"
  - file: "card.md"
    purpose: "one-page orientation, the must-read file"
  - file: "processes.md"
    purpose: "question -> option -> module -> variable map"
  - file: "failures.md"
    purpose: "symptom-indexed list of what looks right and is wrong"
  - file: "recipes.md"
    purpose: "bounded procedures with a stated cost"
  - file: "version.md"
    purpose: "pinned commit and how to check a checkout"
  - file: "sources.md"
    purpose: "citations and provenance"
catalogs:
  generated_from: "the pinned VIC source tree (see version.md)"
  regenerate: "tools/extract_pack.py --pack vic all --source-root <checkout> --out-dir catalogs"
  validate: "tools/validate_catalogs.py --pack-dir <pack-dir> --pack vic --sample-data-root <VIC checkout>/samples/data"
checks:
  global_file: "tools/hcm_check.py check-global-file --pack vic --driver <classic|image> --file <global parameter file>"
  covers: "keys the named driver's parser does not recognize, keys removed since VIC 4 (reported with the parser's own rejection message), and every catalogued validation constraint whose values the file supplies; a constraint it cannot evaluate is reported and counted, never skipped -- see tools/README.md for the exact forms"
curated:
  - file: "curated/options_overlay.yaml"
    purpose: "every verified doc-vs-code and sample-data-vs-code disagreement, re-checked at source"
known_gaps:
  - "no model output was available anywhere reachable by this pack: every fact is read in source (evidence: source_read); input formats are additionally confirmed against the public VIC sample data (Stehekin, submodule 3f2dcb4) where validate_catalogs.py's vic hook checks a fact against the sample global-parameter/soil/domain/forcing files -- see catalogs/MANIFEST.json's validation field for the last run's results"
  - "catalogs/state.yaml covers the image driver's STATE_* variables only (state_metadata.c, under drivers/shared_image): the classic driver's state file has no equivalent metadata table (write_model_state.c writes fields directly with fwrite/fprintf), so its variable order was not reached by this extraction pass"
  - "the python and cesm drivers exist in the source tree but are out of scope for this pack (drivers classic and image only); noted, not catalogued"
  - "the built-in routing extension (vic/extensions/rout_rvic, rout_stub) is read in source only, never run: OUT_DISCHARGE is registered in the shared output metadata regardless of build, but is only ever non-zero when the binary was built with ROUT=rout_rvic (the shipped default is rout_stub, four empty function bodies)"
  - "catalogs/global_parameters.yaml's `type: unclassified` keys (FORCE_TYPE, SNOW_BAND, OUTFILE, OUTVAR, AGGFREQ, COMPRESS, OUT_FORMAT, DOMAIN_TYPE, HISTFREQ) delegate to a helper function or build a structured value the mechanical sscanf-format classifier does not resolve; their presence and driver are catalogued, their exact value grammar is not"
  - "catalogs/global_parameters.yaml's `documented_but_not_parsed`/`documented_in_docs` cross-reference against docs/Documentation/Drivers/<Driver>/GlobalParam.md is a best-effort Markdown-table row match, not a semantic docs parse -- code wins on any disagreement, and curated/options_overlay.yaml records every disagreement verified so far, not an exhaustive review"
  - "catalogs/parameters.yaml's classic_vegparam_option_gates/classic_veglib_option_gates are gate citations only, not a full column-by-column layout of the veg parameter file or veg library (unlike the soil parameter file, whose column order is fully catalogued from read_soilparam.c's own 'Can't find values for <NAME>' markers)"
  - "catalogs/parameters.yaml's image_netcdf_parameters has no reverse mapping to the classic driver's soil-file column names (e.g. image 'infilt' vs classic 'INFILTRATION') -- the two are not aliased to each other in this pack, since the mechanical extraction has no shared key between the two drivers' naming conventions; hcm_lookup.py --pack vic therefore indexes each by its own driver's name only"
  - "catalogs/options.yaml's vic_run_branch_count == 0 fields are not distinguished between 'I/O-only, no physics branch' and 'consumed indirectly through a derived count rather than a direct field test' (e.g. SPATIAL_FROST via Nfrost) -- both currently read as 0 branches"
  - "the RBM knowledge pack is not started (see the dev-repo plan); this pack covers VIC only, and mizuRoute has a pack of its own"
