note: "The river-network topology NetCDF variables popMetadat.f90 declares, one entry per metadata slot. `name` is the DEFAULT NetCDF variable name; `rename_key` is the control-file tag that overrides it. `read_by_default` is popMetadat.f90's own varFile flag, which is exactly the flag read_streamSeg.f90 tests before reading a variable, so it is the required/optional switch: true means the run reads it from the network file. `conditionally_required` records every place read_streamSeg.f90's mod_meta_varFile raises (or lowers) that flag at run time, with the enclosing condition verbatim -- that is how the lake parameter families and the hydraulic-geometry variables become required. A variable whose flag is false is never read and is instead computed (see catalogs/parameters.yaml) or left unused. `dimension` is the ixDims member the metadata names (hru, seg, upHRU, upSeg, upAll, uh, pfaf). `count` counts `variables` only; the runoff and remapping lists are separate and counted separately."
