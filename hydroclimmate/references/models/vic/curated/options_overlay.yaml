  - internal_option_name: null
    global_parameter_key: null
    kind: "code_comment_contradicts_arithmetic"
    applies_to: ["OUT_RHET", "OUT_NEE", "OUT_NPP"]
    note: "sh/put_data.c:508, under options.CARBON: 'out_data[OUT_RHET][0] *= dt_sec / SEC_PER_DAY;  // convert to gC/m2d'. The comment reads as converting TO a per-day rate, but dt_sec/SEC_PER_DAY is a fraction < 1 for any sub-daily model step, so the arithmetic actually converts OUT_RHET from a per-day rate INTO a per-model-step amount -- the opposite of what the comment says. history_metadata.c:1204 still declares OUT_RHET's units as 'g m-2 d-1' (unchanged from the pre-multiplication value's true unit), and :1212 declares the same for OUT_NEE (built at put_data.c:509 as OUT_NPP - OUT_RHET), although OUT_NPP itself is left in 'g m-2 s-1' (history_metadata.c:1188) -- OUT_NEE therefore subtracts a per-model-step amount from a per-second rate. This is the one place this pack's own prose previously repeated the code's wrong comment instead of the arithmetic; catalogs/outputs.yaml's own entries for OUT_RHET, OUT_NEE and OUT_NPP report the declared units unchanged, because those ARE the units history_metadata.c declares; this row is the curated cross-check that records what the arithmetic then does to them, and it is merged into tools/hcm_lookup.py's answer for all three names through this row's applies_to list."
    where:
      file: "vic/drivers/shared_all/src/put_data.c"
      line: 508
      commit: "vic@14a371a8"
    evidence: "source_read"
