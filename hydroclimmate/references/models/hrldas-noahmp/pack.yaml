pack: "hrldas-noahmp"
title: "HRLDAS / Noah-MP"
depth: "reference"
version_scope: "source commit d9f5b205; noahmp submodule 9fbe6724 (v3.7.1-355-g9fbe672); drivers/hrldas build path"
prose:
  - file: "card.md"
    purpose: "one-page orientation, the must-read file"
  - file: "processes.md"
    purpose: "question -> switch -> module -> variable map"
  - file: "failures.md"
    purpose: "symptom-indexed list of what looks right and is wrong"
  - file: "recipes.md"
    purpose: "bounded procedures with a stated cost"
  - file: "version.md"
    purpose: "pinned commit pair and how to check a checkout"
  - file: "sources.md"
    purpose: "citations and provenance"
catalogs:
  generated_from: "the pinned source tree (see version.md)"
  regenerate: "tools/extract_pack.py all --source-root <checkout> --out-dir catalogs"
  validate: "tools/validate_catalogs.py --pack-dir <pack-dir> --ldasout <f> --restart <f> --ldasin <f> --check-kind-sample --apply"
curated:
  - file: "curated/switches.yaml"
    purpose: "declared switch effects: exchanged/untouched fields, expected scaling"
  - file: "curated/checks.yaml"
    purpose: "detectable checks, one per automatable failures.md symptom"
  - file: "curated/kinds_overlay.yaml"
    purpose: "true_kind for variables the mechanical classifier could not resolve"
  - file: "curated/options_overlay.yaml"
    purpose: "README-vs-code cross-checks for physics options"
known_gaps:
  - "SF_URBAN_PHYSICS 2 (BEP) and 3 (BEP+BEM): argument list and weighted-field set only, from source; not confirmed against real output like option 1 (SLUCM)"
  - "crops, irrigation, tile drainage, wetland and glacier options: read in source only, not confirmed against real output"
  - "groundwater/runoff options other than 3 (free drainage, the executable default): read in source only, not confirmed against real output"
  - "true_kind curated for 70 of 179 history variables (curated/kinds_overlay.yaml); the rest carry only the mechanically classified kind"
  - "options_overlay.yaml covers only the readme-vs-code disagreements found, not a hand-verified scheme name for every value of all 27 physics options"
