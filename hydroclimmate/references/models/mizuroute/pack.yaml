pack: "mizuroute"
title: "mizuRoute / vector river routing"
depth: "reference"
version_scope: "source commit 28514dea (tag v3.1.1); standalone driver route_runoff; cesm-coupling recorded only where the code branches on runMode; no input or output data beyond the two sample control files shipped in the checkout"
prose:
  - file: "README.md"
    purpose: "human-facing entry point: coverage, use, file map, limits, regeneration"
  - file: "card.md"
    purpose: "one page: pin, files, methods, what a record means"
  - file: "processes.md"
    purpose: "process map by question; states gates, not tables"
  - file: "failures.md"
    purpose: "symptom-indexed entries, read before reporting a result"
  - file: "recipes.md"
    purpose: "inputs, minimal check, steps, cost, what invalidates them"
  - file: "version.md"
    purpose: "the pin, and how to check a checkout or build"
  - file: "sources.md"
    purpose: "what was read in the pinned tree, what is not established"
catalogs:
  generated_from: "the pinned mizuRoute source tree (see version_scope)"
  regenerate: "tools/extract_pack.py --pack mizuroute all --source-root <checkout> --out-dir catalogs"
  validate: "tools/extract_pack.py --pack mizuroute all --source-root <checkout> --out-dir catalogs -- the sample-control-file validation runs in the same pass and is written to catalogs/MANIFEST.json's validation field"
  files:
    - file: "catalogs/control_keys.yaml"
      purpose: "control-file keys the parser matches, with defaults and accepted sets"
    - file: "catalogs/routing_methods.yaml"
      purpose: "route_opt digit to module, history variables, reach parameters"
    - file: "catalogs/network_inputs.yaml"
      purpose: "network, runoff and remap input variables and when each is required"
    - file: "catalogs/outputs.yaml"
      purpose: "history variables, their buffers, mean versus last value"
    - file: "catalogs/restart.yaml"
      purpose: "restart variables, write-frequency keywords, naming and timing"
    - file: "catalogs/parameters.yaml"
      purpose: "namelist parameters and per-reach RCHPRP fields with derivations"
    - file: "catalogs/constants.yaml"
      purpose: "internal constants, unit conversions, time and calendar facts"
    - file: "catalogs/parallelism.yaml"
      purpose: "decomposition facts and the compile-time parallel limits"
    - file: "catalogs/build.yaml"
      purpose: "Makefile settings, what must be set, shipped compiler flags"
    - file: "catalogs/MANIFEST.json"
      purpose: "machine-only: per-file counts, hashes and the validation report"
    - file: "catalogs/index.json"
      purpose: "machine-only: the generated key index (tools/build_index.py)"
checks:
  control_file: "tools/hcm_check.py check-control-file --pack mizuroute --file <control file>"
  covers: "keys the pinned parser does not recognize -- naming the catalogued consequence for a key only the documentation or a shipped sample uses -- and values outside a catalogued accepted set, quoting the parser's own rejection message; an accepted set stated for part of a value, and the 15 post-parse constraints the catalog carries as a message only, are reported and counted as not evaluated, never skipped -- see tools/README.md for the exact forms"
curated:
  - file: "curated/disagreements_overlay.yaml"
    purpose: "verified doc, sample and code disagreements, re-checked at source"
known_gaps:
  - "no mizuRoute input or output data exists anywhere reachable by this pack apart from the two sample control files in the pinned checkout (route/settings/SAMPLE.control, SAMPLE-coupled.control): every fact is read in source (evidence: source_read), a control key one of those two files uses is additionally graded confirmed_in_sample_input, and nothing here is or can be observed_in_output or both"
  - "no build of any kind exists either: mizuRoute was never compiled, configured or run while this pack was written, so no runtime behaviour, no cost, no scaling figure and no compiler, NetCDF, PIO or MPI version is confirmed anywhere in it"
  - "the shipped route/settings/SAMPLE.control is not runnable at this commit: its lines 150-154 set five <*inflow> tags read_control.f90 has no case for, so the case-default arm aborts the run -- both sample control files are examples, not tested configurations, and neither was executed"
  - "no river network, runoff, remapping, water-management, gauge or restart NetCDF file is reachable, so the catalogued variable names, dimensions and units of those files are read from popMetadat.f90's metadata tables and were never confronted with a real file"
  - "catalogs/routing_methods.yaml's reach_parameters_used lists only the RCHPRP fields each routing module names textually in its own file; a parameter a method reaches through hydraulic.f90's flow-geometry functions is passed as a bare argument and is not attributed to the method by this pass"
  - "catalogs/control_keys.yaml's documented_in_docs / documented_but_not_parsed cross-reference matches the in-repo docs' own control-key table rows and embedded example control files only; it is not a semantic read of the documentation, and prose that describes a key without using either form is not counted"
  - "the cime/coupled build (cime_config/, route/build/cpl/) is out of scope: only the standalone driver's call path is catalogued, and a fact is marked runmode cesm-coupling only where the pinned standalone-shared code itself branches on globalData's runMode"
  - "catalogs/parameters.yaml records the spatially constant namelist parameters and the per-reach RCHPRP fields, not a worked derivation of each routing method's discretisation; the Muskingum-Cunge, kinematic-wave and diffusive-wave computational-molecule sizing (globalData's nMolecule) is not catalogued"
  - "the tracer/solute path and the streamflow-modification (data-assimilation) path are catalogued only through the control keys, output variables and restart variables they touch; their algorithms are not"
  - "catalogs/build.yaml states what route/build/Makefile requires; those settings are read, never exercised, since nothing here was ever compiled"
  - "the RBM knowledge pack is not started (see the dev-repo plan); this pack covers mizuRoute only"
