pack: "hrldas-noahmp"
files:
  - file_kind: "setup data"
    statement: "setup data (HRLDAS_SETUP_FILE), forcing input (YYYYMMDDHH.LDASIN_DOMAIN<n>) and derived output/restart (YYYYMMDDHH.LDASOUT_DOMAIN<n>, RESTART.YYYYMMDDHH_DOMAIN<n>) are separate file kinds with distinct locations and naming"
    source: "L1"
    scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
    basis: "source_read"
    from:
      file: "card.md"
      anchor: "hrldas--noah-mp--card"
    confirmed_against: "41a796f7534cd5fc"
  - file_kind: "restart"
    statement: "an existing restart filename is not evidence of a successful restart -- RESTART_FILENAME_REQUESTED must be set to restart, and with RESTART_FREQUENCY_HOURS <= 0 restart files are written monthly regardless; check restart Times/START_DATE, configuration and forcing/accumulator continuity instead"
    source: "L1"
    scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
    basis: "source_read"
    from:
      file: "failures.md"
      anchor: "a-restart-file-exists-so-the-run-restarted-successfully"
    confirmed_against: "525b6845e5a6dbae"
inputs:
  - variable: "meteorological forcing (T2D, Q2D, U2D, V2D, PSFC, LWDOWN, SWDOWN, RAINRATE)"
    aspect: "forcing_categories"
    statement: "meteorological forcing carries temperature, specific humidity, wind components, surface pressure, downward longwave/shortwave radiation and precipitation rate; see catalogs/forcing.yaml for the exact forcing_name_* namelist keys and units"
    source: "L1"
    scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
    basis: "both"
    from:
      file: "card.md"
      anchor: "hrldas--noah-mp--card"
    confirmed_against: "41a796f7534cd5fc"
  - variable: "vegetation-type parameter table (class-indexed, table-dependent)"
    aspect: "identity"
    statement: "SF_URBAN_PHYSICS controls the FlagUrban gate (true only when SF_URBAN_PHYSICS == 0). With SF_URBAN_PHYSICS == 0 the column keeps the table ISURBAN class and gets Noah-MP's internal urban treatment (95% impervious top soil layer unconditionally; Saxton-Rawls pedotransfer additionally skipped only when SOIL_DATA_OPTION == 3). With SF_URBAN_PHYSICS > 0 the vegetation type is instead reassigned to the table NATURAL class and GVFMAX is forced to 96%; FlagUrban stays false, so the column loses the internal urban treatment entirely (no impervious layer; pedotransfer now runs instead of being skipped, but only when SOIL_DATA_OPTION == 3)."
    source: "L5"
    scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
    basis: "source_read"
    from:
      file: "processes.md"
      anchor: "urban-what-sf_urban_physics-does"
    confirmed_against: "f14c98412061a0e5"
outputs:
  - variable: "SNEQV (identity against SNICE + SNLIQ)"
    aspect: "identity"
    statement: "in the zero-layer snow state (ISNOW == 0) SNEQV can be positive while SNICE and SNLIQ are exactly zero; a layer is created only at SnowDepth >= 0.025 m. Observed: 276 and 783 cells in two autumn records of one regional offline run, SNEQV up to ~3.05 mm, layer sums exactly 0.0; where ISNOW < 0 the identity holds to float precision"
    source: "L2"
    scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
    basis: "both"
    from:
      file: "failures.md"
      anchor: "snow-water-equivalent-does-not-equal-the-sum-of-the-snow-layers"
    confirmed_against: "93b5d5f2a09a4765"
  - variable: "float output fields on water-body cells (see catalogs/outputs.yaml fill_note)"
    aspect: "fill"
    attribute_declared: false
    known_raw_value_order: -1.0e+33
    statement: "missing_value = -1.E33 is a global attribute only; no variable carries a per-variable _FillValue/missing_value, so standard netCDF4/xarray auto-masking does nothing. Float fields are set to -1.E33 where IVGTYP == ISWATER; integer fields and 2-D restart fields are not masked at all"
    source: "L1"
    scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
    basis: "both"
    from:
      file: "failures.md"
      anchor: "everything-over-water-is-a-huge-negative-number-or-the-mean-is-nonsense"
    confirmed_against: "eb4b3ebbdece9aba"
