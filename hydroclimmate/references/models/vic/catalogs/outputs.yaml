note: "name/units/description/kind (default_agg_type) are driver: both -- history_metadata.c/set_output_defaults.c/vic_history.c are shared code (vic/drivers/shared_all/src), not per-driver. default_agg_type is AGG_TYPE_AVG (mean over the output interval) unless the mechanical switch in get_default_outvar_aggtype() names AGG_TYPE_END (state, valid at interval end) or AGG_TYPE_SUM (flux, summed over the interval) for that variable -- AGG_TYPE_MAX/MIN/BEG exist in the enum for user-overridden aggregation in the global parameter file but are never a variable's own default at this commit. `populated` is `true` iff the name appears as an out_data[...] subscript anywhere in put_data.c -- `false` means registered but never written (a phantom; see the entry's own `note`). `note` also flags the mechanical signature of an upstream metadata copy-paste (a field written twice for one entry, paired with a neighbor missing that field entirely). `agg_types` is the aggregation-method enum itself, catalogued so each AGG_TYPE_* constant resolves by name through tools/hcm_lookup.py."
