note: "Every history-file variable popMetadat.f90 declares, reach fluxes (meta_rflx, dimension seg x time) and HRU fluxes (meta_hflx, hru x time). `kind` is NOT taken from any comment: it is derived from what histVars_data.f90 actually does to the variable's buffer -- accumulated in aggregate() and divided by the sample count in finalize() gives interval_mean; overwritten in aggregate() and untouched by finalize() gives instantaneous_end_of_interval. `kind_evidence` states which of the two it was, and `accumulated_where`/`finalized_where`/`reset_where` cite the lines. `default_write` is popMetadat.f90's own writeOut flag; `control_keys` is the control tag(s) that set it, and `forced_by_code` is every place read_control.f90 overrides it after the control file was read (a routing method not selected, floodplain off, outputInflow on, tracer off) -- a switch set to true in the control file does NOT guarantee the variable is written. A variable with no `control_keys` entry cannot be switched on from the control file at all at this commit. `count` counts `variables` only."
