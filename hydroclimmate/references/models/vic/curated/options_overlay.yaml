  - internal_option_name: "QUICK_FLUX"
    global_parameter_key: "QUICK_FLUX"
    kind: "conditional_default_not_a_static_initializer"
    note: "initialize_options.c sets options.QUICK_FLUX = true unconditionally (a flat default, matching docs/Documentation/Drivers/Classic/GlobalParam.md's plain reading). But docs/Documentation/Drivers/Classic/GlobalParam.md actually states a CONDITIONAL default (\"Default = FALSE ... when running FROZEN_SOIL; and TRUE ... in all other cases\"), and code delivers exactly that conditional behavior as a SIDE EFFECT of parsing the FROZEN_SOIL key (classic get_global_param.c:110-116, marked with the code's own comment \"// TODO: move these steps to a option validation\"): if FROZEN_SOIL is set true in the global parameter file, QUICK_FLUX is forced back to false at that same moment, regardless of QUICK_FLUX's own static default or an earlier QUICK_FLUX line in the same file. This means QUICK_FLUX's effective default depends on FROZEN_SOIL and on which key is parsed textually last, not on a single static value -- a real trap for anyone reading only catalogs/global_parameters.yaml's own default_in_code field (which reports the static initializer value, true, not this conditional override)."
    where:
      file: "vic/drivers/classic/src/get_global_param.c"
