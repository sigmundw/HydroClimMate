note: "STATE_* variable metadata (state_metadata.c's set_state_meta_data_info) and NetCDF shape (vic_store.c's set_nc_state_var_info, `nc_dims`/`nc_dim_names`/`dims_where`) for the IMAGE driver's state file only (the file this catalog reads lives under drivers/shared_image, not shared_all -- `scope` names both drivers because the pinned commit as a whole covers both, not because this catalog's own content does; the classic driver's own state-file writer/reader has no equivalent metadata table and was not reached by this extraction pass, see known_gaps). `header_comment` is the STATE_* enum's own doxygen comment in vic_driver_shared_all.h -- `header_comment_where` cites that file, separate from `where` (state_metadata.c). `count` is the number of `variables` entries only, matching every other catalog's own convention; `consistency_checks_count` is the separate count of `consistency_checks` entries (do not add the two together -- they are different lists, not one). consistency_checks are the dimension/option cross-checks vic_restore.c runs between the state file being read and the currently-configured run (grid size, veg classes, snow bands, soil layers, frost areas, soil nodes, lake nodes, soil node depths) before accepting it -- these are the options that MUST match between the writing and reading run."
