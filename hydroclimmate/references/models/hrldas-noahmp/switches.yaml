    structural_change: {"statement": "SF_URBAN_PHYSICS controls the FlagUrban gate: ConfigVarInitDefault resets it false for every column at the start of that column's step, and ConfigVarInTransfer sets it true ONLY when SF_URBAN_PHYSICS == 0. With SF_URBAN_PHYSICS == 0 the column keeps the table ISURBAN class and gets Noah-MP's internal urban treatment, unconditional on FlagUrban alone: 95% impervious top soil layer, urban soil-moisture and soil-heat-capacity parameters, zero-LAI/SAI, FVEG forced to 0; ADDITIONALLY, Saxton-Rawls pedotransfer is skipped only when SOIL_DATA_OPTION == 3 (under 1/2/4 no column runs pedotransfer at all, urban or not). With SF_URBAN_PHYSICS > 0 the vegetation type is instead reassigned to the table NATURAL class and GVFMAX is forced to 96%; FlagUrban stays false, so the column LOSES every FlagUrban-gated behaviour above (no impervious layer, no urban soil/thermal parameters, ordinary phenology) and, only under SOIL_DATA_OPTION == 3, pedotransfer now RUNS where it would otherwise have been skipped -- the opposite direction from the SF_URBAN_PHYSICS == 0 case, and only for that one SOIL_DATA_OPTION value.", "source": "L5", "scope": "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path", "basis": "source_read", "from": {"file": "processes.md", "anchor": "urban-what-sf_urban_physics-does"}, "confirmed_against": "f14c98412061a0e5"}
    exchanged_fields: {"fields": ["ALBEDO", "HFX", "QFX", "LH", "GRDFLX", "TSK", "QSFC", "UST"], "statement": "at SF_URBAN_PHYSICS=1 (SLUCM) the urban routine tile-weights exactly these eight fields by FRC_URB2D (GRDFLX with a sign flip on the urban part): ALBEDO, HFX, QFX, LH, GRDFLX, TSK, QSFC, UST. EMISS is declared INTENT(INOUT) but is NOT weighted in this path. Of the eight, only ALBEDO, HFX, LH, GRDFLX are history variables; QSFC is restart-only; QFX, TSK, UST are written to neither file kind, so a comparison against real output can only use four of the eight directly. Options 2/3 (BEP/BEP+BEM) weight a different, larger set including emiss -- this fact does not carry to them.", "source": "L5", "scope": "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path", "basis": "source_read", "from": {"file": "processes.md", "anchor": "urban-what-sf_urban_physics-does"}, "confirmed_against": "f14c98412061a0e5"}
    untouched_fields: {"fields": ["snow state", "soil-moisture state", "soil-temperature state"], "statement": "no snow, soil-moisture or soil-temperature variable is in the offline urban routine's argument list at all (option 1); TG, TV, TRAD, FSA, FIRA, SNEQV, SNOWH, FSNO, SOIL_M, SOIL_T, SFCRNOFF and the rest stay whatever value the FlagUrban-gated internal treatment (or its absence) already produced for the reassigned column", "source": "L5", "scope": "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path", "basis": "source_read", "from": {"file": "processes.md", "anchor": "urban-what-sf_urban_physics-does"}, "confirmed_against": "f14c98412061a0e5"}
