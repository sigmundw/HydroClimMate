note: "Every control-file tag read_control.f90's own select on trim(cName) accepts, in source order. `assigns_to` is the public_var.f90 variable (or popMetadat.f90 metadata field) the arm writes; `fortran_type` and `default_literal` come from that variable's own declaration in public_var.f90, and `requiredness` is derived from it mechanically: a variable initialised to one of public_var's missing-value sentinels (charMissing/realMissing/integerMissing) has no usable default and must be set. A key whose arm writes a metadata %varFile/%varName field has no public_var default of its own; its effective default is the value popMetadat.f90 sets (see catalogs/outputs.yaml and catalogs/network_inputs.yaml). `allowed_values` is present only for the variables the code actually constrains, and is read from the select block that constrains them. A tag NOT in this list is not merely ignored: read_control.f90's case-default arm aborts the run (`unrecognized_key_message`). `documented_but_not_parsed` and `in_sample_but_not_parsed` are the doc-vs-code and sample-vs-code disagreements this pass found; code wins, and curated/disagreements_overlay.yaml records each one re-checked at source. `count` counts `keys` only."
