# Generation 1 (see SCHEMA.md): mechanically converted from JSON to YAML,
# content unchanged and verified equal by loading both.
pack: "issm"
files: []
inputs:
  - variable: "mesh parameter arrays (vertex-sized and element-sized)"
    aspect: "valid_support"
    statement: "ISSM examples distinguish values assigned to vertices from values assigned to elements; the ISMIP tutorial, for example, uses vertex-sized and element-sized parameter arrays in the same model; array length alone is not a physical area weight"
    source: "I4"
    scope: "ISSM ISMIP tutorial, retrieved 2026-09-16"
    basis: "source_read"
    from:
      file: "overview.md"
      anchor: "what-the-mesh-represents"
  - variable: "geometry, material properties and boundary conditions (stress-balance solve inputs)"
    aspect: "identity"
    statement: "a stress-balance calculation determines a velocity field for supplied geometry, material properties and boundary conditions"
    source: "I1"
    scope: "ISSM stress balance documentation, retrieved 2026-09-16"
    basis: "source_read"
    from:
      file: "overview.md"
      anchor: "distinguish-the-questions-being-solved"
outputs:
  - variable: "velocity field (stress-balance solve output)"
    aspect: "identity"
    statement: "a completed velocity solve alone says nothing about how thickness evolved through time"
    source: "I1"
    scope: "ISSM stress balance documentation, retrieved 2026-09-16"
    basis: "source_read"
    from:
      file: "pitfalls.md"
      anchor: "a-completed-velocity-solve-mistaken-for-a-transient-thickness-history"
  - variable: "mass-transport rates (surface accumulation, basal melt)"
    aspect: "units"
    statement: "the documented depth-integrated convention uses surface accumulation positive for gain and basal melt positive for loss, expressed as ice-equivalent rates"
    source: "I3"
    scope: "ISSM mass transport documentation, retrieved 2026-09-16"
    basis: "source_read"
    from:
      file: "overview.md"
      anchor: "distinguish-the-questions-being-solved"
  - variable: "grounding-line statistics (grounded/floating/all-ice)"
    aspect: "valid_support"
    statement: "grounded, floating and all-ice statistics need explicit masks and treatment of partial elements"
    source: "I6"
    scope: "ISSM grounding lines documentation, retrieved 2026-09-16"
    basis: "source_read"
    from:
      file: "pitfalls.md"
      anchor: "integration-weights-reused-after-a-mesh-or-mask-change"
