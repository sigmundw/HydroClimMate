note: "vic_run_branch_citations covers every options.FIELD reference under vic/vic_run/src/*.c (both `if (options.X)` plain-bool tests and `options.X == ENUM_VALUE` equality tests, since both compile to the same source-text pattern this regex matches; distinguishing them is left to the citation's own text). vic_run is shared between drivers, so every citation here is driver: both -- the driver-specific half (which global-parameter-file KEY sets this option, and its default) is in catalogs/global_parameters.yaml's `assigned_field` cross-reference (options.<FIELD>). A field with vic_run_branch_count == 0 is not itself a physics-code no-op: it may gate driver/parameter-I/O code outside vic/vic_run (e.g. Noutstreams, STATE_FORMAT) or be consumed indirectly through a derived count rather than a direct field test (e.g. SPATIAL_FROST via Nfrost) -- not distinguished further at this mechanical pass; see known_gaps."
