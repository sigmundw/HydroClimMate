unit_hydrographs:
  - statement: "the basin (hillslope) unit hydrograph is a two-parameter gamma distribution with shape fshape and time scale tscale, evaluated at multiples of the simulation time step; the number of bins is chosen so the cumulative probability lands between 0.99 and 0.999"
    where:
      file: "route/build/src/process_param.f90"
      line: 56
      commit: "mizuroute@28514dea"
      runmode: "both"
    evidence: "source_read"
    scope: "mizuRoute 28514dea (tag v3.1.1); standalone driver route_runoff; cesm-coupling noted only where the code branches on runMode"
  - statement: "the basin unit-hydrograph ordinates are renormalised to sum to exactly 1, so truncating the histogram does not lose water"
    where:
      file: "route/build/src/process_param.f90"
      line: 90
      commit: "mizuroute@28514dea"
      runmode: "both"
    evidence: "source_read"
    scope: "mizuRoute 28514dea (tag v3.1.1); standalone driver route_runoff; cesm-coupling noted only where the code branches on runMode"
  - statement: "the channel IRF unit hydrograph is the Saint-Venant/Lohmann (1996) solution with celerity velo [m/s] and diffusivity diff [m2/s], built on a fixed 1-hour internal step (dTUH) over at most 240 hours and then aggregated to the simulation time step"
    where:
      file: "route/build/src/process_param.f90"
      line: 186
      commit: "mizuroute@28514dea"
      runmode: "both"
    evidence: "source_read"
    scope: "mizuRoute 28514dea (tag v3.1.1); standalone driver route_runoff; cesm-coupling noted only where the code branches on runMode"
note: "The spatially constant parameters read from the namelist named by <param_nml> (read_param.f90 reads all three groups unconditionally, so the namelist must contain HSLOPE, IRF_UH and KWT even for a run that uses only one of them), plus the per-reach parameter structure RCHPRP and how each of its fields is filled. A namelist parameter has NO compiled-in default: fshape, tscale, velo, diff, mann_n and wscale are declared in globalData.f90 without an initialiser, so their value comes only from the namelist. `compiled_in_parameters` are the routing parameters that do have a compiled default and no control key or namelist entry at all. `reach_parameter_derivations` are the process_ntopo.f90 lines that fill a reach parameter, including the hydraulic-geometry relations used when the network file does not supply width/depth/Manning n (see catalogs/network_inputs.yaml's `conditionally_required`). `parameters` is the flat, name-keyed list of all three parameter kinds (`parameter_kind`); `namelist_groups` is the same namelist parameters grouped as read_param.f90 reads them. `count` counts `parameters` only."
