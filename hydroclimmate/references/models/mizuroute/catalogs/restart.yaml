note: "Every restart-file variable popMetadat.f90 declares, grouped by the routing method or component that owns it (`belongs_to`). `written_by_default` is the metadata's own writeOut flag; a qerror_* variable is declared false and is written only when the streamflow-modification (data-assimilation) path is active. Restart variables have no per-variable control key: the whole file is gated by <restart_write> (see `write_frequency`, whose keywords are matched case-insensitively) and <restart_date>/<restart_month>/<restart_day>/<restart_hour>. Dimension names are the ixStateDims members (seg, hru, time, tbound, wave, mol_kw, mol_mc, mol_dw, tdh_irf, tdh, nchars, hist_fil). `count` counts `variables` only."
