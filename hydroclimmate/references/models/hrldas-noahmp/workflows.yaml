# Re-sourced to cite the pack's own prose
# (card.md/processes.md/failures.md/recipes.md/version.md/sources.md), not the
# redirect stubs (overview.md/outputs.md/execution.md/pitfalls.md).
pack: "hrldas-noahmp"
workflows:
  - name: "minimal-preflight-and-continuation"
    steps:
      - step: 1
        what_is_done: "confirm the commit pair (or the five header facts) and the forcing variable names, units and time convention"
        must_establish: "T2D is K, Q2D is specific humidity (converted internally to mixing ratio), RAINRATE forcing is mm/s -- a file timestamp alone does not establish a record's represented interval"
        check: null
        source: "L1"
        scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
        basis: "source_read"
        from:
          file: "version.md"
          anchor: "checking-a-checkout"
        confirmed_against: "2fdd3a23fb7a6068"
      - step: 2
        what_is_done: "record the adopted physics options and check each one's gate, not just the namelist line"
        must_establish: "several options are silently inert unless a gate is open (tile drainage, SNICAR, DVIC infiltration, inconsistent surface/subsurface runoff options)"
        check: null
        source: "L2"
        scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
        basis: "source_read"
        from:
          file: "failures.md"
          anchor: "a-switch-was-turned-on-and-the-output-is-identical"
        confirmed_against: "39b9635704f9bcb3"
      - step: 3
        what_is_done: "inspect the first output records for time stamps, -9999 fields and fill values before trusting anything"
        must_establish: "the first record is the initial state with fluxes never computed (physics skipped at ITIME==0); drop it or set SKIP_FIRST_OUTPUT"
        check: "accumulation-and-fill (on the short interval's output, for missing/large-negative values)"
        source: "L1"
        scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
        basis: "both"
        from:
          file: "failures.md"
          anchor: "the-first-record-of-a-run-has-fluxes-of--9999"
        confirmed_against: "48c8df8c0c3da232"
      - step: 4
        what_is_done: "before continuation, check restart state time, configuration, forcing continuity and accumulator continuity"
        must_establish: "an existing restart filename alone is not proof of a successful restart (RESTART_FILENAME_REQUESTED must be set; monthly restarts are written regardless when RESTART_FREQUENCY_HOURS <= 0)"
        check: null
        source: "L1"
        scope: "HRLDAS d9f5b205 + noahmp 9fbe6724; drivers/hrldas build path"
        basis: "source_read"
        from:
          file: "failures.md"
          anchor: "a-restart-file-exists-so-the-run-restarted-successfully"
        confirmed_against: "525b6845e5a6dbae"
