classic_baseflow_conversion:
  - topic: "baseflow_nijssen2001_to_arno_conversion"
    statement: "When BASEFLOW==NIJSSEN2001, the d1/d2/d3/d4 parameters read from the soil file are converted in place to the ARNO Ds/Dsmax/Ws/c parameters vic_run itself uses."
    code: "layer = options.Nlayer - 1; temp->Dsmax = temp->Dsmax * pow( (double) (1. / (temp->max_moist[layer] - temp->Ws)), -temp->c) + temp->Ds * temp->max_moist[layer]; temp->Ds = temp->Ds * temp->Ws / temp->Dsmax; temp->Ws = temp->Ws / temp->max_moist[layer];"
    where:
      file: "vic/drivers/classic/src/read_soilparam.c"
      line: 698
      commit: "vic@14a371a8"
      driver: "classic"
    evidence: "source_read"
    scope: "VIC 14a371a8 (tag 5.1.0); drivers classic + image; sample data 3f2dcb4"
