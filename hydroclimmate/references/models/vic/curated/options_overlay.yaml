  - internal_option_name: "BASEFLOW"
    global_parameter_key: "BASEFLOW"
    kind: "driver_asymmetric_validation"
    note: "Image's get_global_param.c enumerates BOTH values explicitly -- NIJSSEN2001 (image get_global_param.c:394-396) and ARNO (:397-399) -- and closes with an else-branch calling log_err(\"Unknown BASEFLOW option: %s\") at :400-402, so any third spelling, including a typo of ARNO, is fatal. Classic's get_global_param.c:412-420 enumerates only NIJSSEN2001 (:414-416); its else at :417-419 assigns options.BASEFLOW = ARNO unconditionally, so every value other than case-insensitive \"NIJSSEN2001\" -- including a typo -- silently becomes ARNO, with no warning, and the four baseflow soil columns are then taken literally instead of being converted. This is a real classic-vs-image difference in how a misspelled value is handled, not merely a missing catalog fact."
    where:
