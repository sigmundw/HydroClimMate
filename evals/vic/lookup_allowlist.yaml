# Curated allowlist -- identifiers that appear backticked in card.md/processes.md/
# failures.md/recipes.md and look like a model identifier, but do not resolve through
# hcm_lookup.py --pack vic (exact or alias), each with why. Checked by
# evals/check_knowledge.py:check_source_identifiers_resolve. Never a silent exclusion:
# every row states the specific reason it cannot resolve.
pack: "vic"
catalog: "lookup_allowlist"
curated: true
count: 20
rows:
  - identifier: "AVG"
    reason: "bare prose shorthand for the aggregation method; the constant itself, AGG_TYPE_AVG, resolves through hcm_lookup.py (catalogs/outputs.yaml agg_types), this abbreviation of it does not."
  - identifier: "BEG"
    reason: "bare prose shorthand for the aggregation method; the constant itself, AGG_TYPE_BEG, resolves through hcm_lookup.py (catalogs/outputs.yaml agg_types), this abbreviation of it does not."
  - identifier: "END"
    reason: "bare prose shorthand for the aggregation method; the constant itself, AGG_TYPE_END, resolves through hcm_lookup.py (catalogs/outputs.yaml agg_types), this abbreviation of it does not."
  - identifier: "MAX"
    reason: "bare prose shorthand for the aggregation method; the constant itself, AGG_TYPE_MAX, resolves through hcm_lookup.py (catalogs/outputs.yaml agg_types), this abbreviation of it does not."
  - identifier: "MIN"
    reason: "bare prose shorthand for the aggregation method; the constant itself, AGG_TYPE_MIN, resolves through hcm_lookup.py (catalogs/outputs.yaml agg_types), this abbreviation of it does not."
  - identifier: "SUM"
    reason: "bare prose shorthand for the aggregation method; the constant itself, AGG_TYPE_SUM, resolves through hcm_lookup.py (catalogs/outputs.yaml agg_types), this abbreviation of it does not."
  - identifier: "FROM_DEFAULT"
    reason: "enum constant for a *_SRC-family key (e.g. ALB_SRC/FCAN_SRC/LAI_SRC), not enumerated inline in get_global_param.c's own strcasecmp chain the way BASEFLOW's values are, so not a separate catalog entry."
  - identifier: "TRUE"
    reason: "boolean literal value used throughout the global parameter file and prose, not a model-specific identifier."
  - identifier: "FALSE"
    reason: "boolean literal value, same as TRUE."
  - identifier: "MISSING"
    reason: "generic sentinel/uninitialized-value macro used throughout VIC's C source, not a specific catalogued identifier."
  - identifier: "NC_CLASSIC_MODEL"
    reason: "a NetCDF C library format constant (netcdf.h), not a VIC-defined identifier -- out of this pack's extraction scope (VIC source only)."
  - identifier: "NC_FILL_DOUBLE"
    reason: "NetCDF C library fill-value constant, same as NC_CLASSIC_MODEL."
  - identifier: "NC_FILL_FLOAT"
    reason: "NetCDF C library fill-value constant, same as NC_CLASSIC_MODEL."
  - identifier: "NC_INT"
    reason: "NetCDF C library type constant, same as NC_CLASSIC_MODEL."
  - identifier: "NYEARS"
    reason: "not a key get_global_param.c parses at this commit (checked directly: no strcasecmp(\"NYEARS\", optstr) branch in either driver) -- if used in prose it is describing the sample data's run length informally, not citing a catalogued key."
  - identifier: "OUTPUT_STEPS_PER_DAY"
    reason: "named only inside classic's OUT_DT rejection message (\"OUT_DT has been replaced with OUTPUT_STEPS_PER_DAY\") -- checked directly: neither driver's get_global_param.c actually has a strcasecmp(\"OUTPUT_STEPS_PER_DAY\", optstr) branch at this pinned commit (5.1.0). A real code/message gap, not an extraction gap; recorded here rather than guessed into the catalog."
  - identifier: "ROUT"
    reason: "the built-in routing extension (vic/extensions/rout_rvic, rout_stub) is out of this pack's stated scope (drivers classic and image only, per pack.yaml's version_scope); ROUT-prefixed identifiers are not extracted."
  - identifier: "STATE_ROUT_RING"
    reason: "a routing-extension state variable (vic/extensions/rout_rvic), out of scope for the same reason as ROUT -- catalogs/state.yaml covers vic/drivers/shared_image/src/state_metadata.c's STATE_* enum only."
  - identifier: "SUPPLIED"
    reason: "a fragment of JULY_TAVG_SUPPLIED as rendered in prose (e.g. distinguishing the flag's TRUE/FALSE meaning), not a standalone identifier; JULY_TAVG_SUPPLIED itself resolves through hcm_lookup.py."
  - identifier: "YDIM"
    reason: "informal shorthand for the image driver's y-spatial NetCDF dimension (global_domain.info.y_dim, a runtime-resolved name, not a fixed string 'YDIM' in source) used descriptively in prose, not a literal catalogued identifier."
