note: "Both drivers accept the same 15 short-code forcing type names (the shared enum in vic_driver_shared_all.h) via an identical strcasecmp(\"NAME\", optstr)-chain in get_force_type.c (classic) / set_force_type.c (image); the two differ only in what the matched line then binds the type to -- a positional column (classic) or an explicit NetCDF variable name (image), not in the vocabulary of accepted type names itself. `required` set (which types a run must supply) and the VIC-5-no-longer-disaggregates-daily-forcings / forcing-timestep-vs-model-timestep rule are recorded in catalogs/global_parameters.yaml's constraints (FORCE_STEPS_PER_DAY-related keys), not duplicated here -- see known_gaps for what this catalog does not itself state about required-ness per variable (VIC's forcing requirements are combinatorial -- e.g. either PREC or its equivalents, either SWDOWN/LWDOWN or elements to derive them -- and are not encoded as a simple per-type required flag in this parser; recorded as a known gap rather than guessed). `units` is the TYPE's own declared unit (get_force_type.c/the enum comment), except for CATM and CHANNEL_IN, corrected here because the code's actual read/consumption unit disagrees (independent review C1/C2) -- see `units_note_where`. `internal_unit_comment`/`read_scale`/`read_where` are the mechanical unit-on-file -> conversion-on-read -> internal-unit chain for EVERY type in both drivers: `internal_unit_comment` is the code's own comment immediately above the read (vic_force.c), `read_scale` lists any `* CONST`/`/ CONST` applied to the value on the read line OR to the stored field by a later compound assignment anywhere in the same vic_force.c (null means no conversion was found anywhere in that file, not merely none on the read line -- the image driver converts pressure and vapour pressure to Pa in a separate loop well below the read, and `read_note` names both lines when the chain has two steps), and `read_where` cites the line that sets the internal unit. The three vegetation-history types (ALBEDO, LAI, FCANOPY) are read into the per-vegetation-tile veg_hist array rather than the force struct, and their own `read_note` says so and cites the forcing read, not the monthly-climatology default both drivers write to the same fields first. A type never read in vic_force.c at all (SKIP, the column-placeholder type) carries null in all four -- reported, not guessed."
