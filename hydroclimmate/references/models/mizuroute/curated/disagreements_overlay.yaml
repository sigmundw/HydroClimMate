  - subject: "volume, solute_mass"
    kind: "deliberate_no_op_that_changes_a_variables_time_meaning"
    note: "histVars_data.f90's aggregate() accumulates every history buffer with += except volume (line 231) and solute_mass (line 241), which are overwritten with the current step's value; finalize() then divides every buffer by the sample count nt except those same two, whose statements are the no-ops this%volume = this%volume (line 280) and this%solute_mass = this%solute_mass (line 303). The consequence is that in one history record the discharge, runoff, inflow, water-height, flood-volume and solute-flux variables are MEANS over the output interval while the volume and solute-mass variables are the value at the LAST simulation step of that interval. This is what catalogs/outputs.yaml's kind field reports (interval_mean versus instantaneous_end_of_interval); the two must not be differenced or summed alike."
    where:
      file: "route/build/src/histVars_data.f90"
      line: 280
      commit: "mizuroute@28514dea"
    reset_where:
      file: "route/build/src/histVars_data.f90"
      line: 322
