  - internal_option_name: null
    global_parameter_key: "CATM"
    kind: "documented_unit_contradicted_by_code"
    note: "get_force_type.c's own comment and docs/Documentation/Drivers/Classic/ForcingData.md both say CATM is ppm. Nothing scales the value on read in either driver (cl/vic_force.c, im/vic_force.c: force.Catm is copied unchanged from the raw forcing value -- see catalogs/forcing.yaml's own read_scale=null for CATM in both drivers), and sh/put_data.c:137 divides the stored value by PPM_to_MIXRATIO (1.0e-6, vic_physical_constants.h:37) when writing OUT_CATM. VIC's own internal/consumed value is therefore a mixing ratio (fraction), not ppm -- a file built and read as ppm is wrong by a factor of 1e6, silently. Already corrected directly in catalogs/forcing.yaml's own `units` field for this entry; this row is the curated cross-check that verified it, re-opened at the cited line."
    where:
      file: "vic/drivers/shared_all/src/put_data.c"
      line: 137
      commit: "vic@14a371a8"
    evidence: "source_read"
    scope: "VIC 14a371a8 (tag 5.1.0); drivers classic + image"
  - internal_option_name: null
    global_parameter_key: "CHANNEL_IN"
    kind: "documented_unit_contradicted_by_code"
    note: "get_force_type.c documents CHANNEL_IN as [m3]. It is consumed unchanged as a depth in mm over the grid cell (sh/put_data.c:126, comment \"mm over grid cell\") and converted to m3 only at the point of use in the lake water balance (vic/vic_run/src/vic_run.c:418-419: lake_var->channel_in = force->channel_in[NR] * soil_con->cell_area / MM_PER_M). The file/internal-force-struct unit is mm depth, not m3 -- m3 is a derived, lake-path-only quantity. Already corrected directly in catalogs/forcing.yaml's own `units` field for this entry; this row is the curated cross-check that verified it, re-opened at the cited line."
