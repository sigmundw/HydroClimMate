note: "Covers the disagreements found while building this pack's generated catalogs, not an exhaustive line-by-line review of docs/source against every control key, variable or parameter. catalogs/control_keys.yaml's own documented_in_docs, documented_but_not_parsed and in_sample_but_not_parsed fields are the generated, mechanical half of this cross-check; this file is the curated, judgement half. A row's `where` cites the place the disagreement is visible and `code_where`, where present, cites the code that wins."
